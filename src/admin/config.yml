# ════════════════════════════════════════════════════════════
#  관리자 모드 설정 (Decap CMS)
#  ▼ 아래 repo 한 줄만 본인 깃허브 주소로 바꾸면 됩니다.
#    예: repo: hong-gildong/wawa-site
# ════════════════════════════════════════════════════════════
backend:
  name: github
  repo: 깃허브아이디/저장소이름
  branch: main
  commit_messages:
    create: "새 글: {{slug}}"
    update: "수정: {{slug}}"
    delete: "삭제: {{slug}}"
    uploadMedia: "사진 올림: {{path}}"
    deleteMedia: "사진 삭제: {{path}}"

# 초안 → 검토 → 발행 흐름.
# 초안은 미리보기 배포(크레딧 무료)로만 돌고, '발행'을 눌렀을 때만 실제 사이트가 한 번 배포됩니다.
publish_mode: editorial_workflow

locale: "ko"
site_url: "https://OO.netlify.app"
display_url: "https://OO.netlify.app"
logo_url: "/assets/img/favicon.svg"

media_folder: "src/assets/img/uploads"
public_folder: "/assets/img/uploads"

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:

  # ── 학습정보 ────────────────────────────────────────────
  - name: "info"
    label: "학습정보"
    label_singular: "학습정보 글"
    description: "블로그처럼 쌓아 가는 글입니다. 저장하면 1~2분 뒤 사이트에 나타납니다."
    folder: "src/info/posts"
    create: true
    slug: "{{fields.slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{title}}  ·  {{year}}.{{month}}.{{day}}"
    sortable_fields: ["date", "title", "category"]
    view_filters:
      - { label: "공부법", field: category, pattern: "study" }
      - { label: "내신 대비", field: category, pattern: "exam" }
      - { label: "학부모 가이드", field: category, pattern: "parent" }
      - { label: "입시 정보", field: category, pattern: "admission" }
    fields:
      - { label: "제목", name: "title", widget: "string" }
      - label: "글 주소"
        name: "slug"
        widget: "string"
        hint: "영문 소문자와 하이픈만. 예) wrong-answer-note → /info/wrong-answer-note/ 로 열립니다. 발행 후에는 바꾸지 마세요."
        pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "영문 소문자, 숫자, 하이픈만 쓸 수 있어요"]
      - { label: "요약", name: "description", widget: "text", hint: "검색 결과와 목록에 그대로 보입니다. 80~140자를 권합니다." }
      - { label: "발행일", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - label: "주제"
        name: "category"
        widget: "select"
        options:
          - { label: "공부법", value: "study" }
          - { label: "내신 대비", value: "exam" }
          - { label: "학부모 가이드", value: "parent" }
          - { label: "입시 정보", value: "admission" }
      - { label: "대표 사진", name: "cover", widget: "image", required: false, hint: "비워 두면 기본 사진이 들어갑니다." }
      - { label: "대표 사진 설명", name: "coverAlt", widget: "string", required: false, hint: "사진을 못 보는 사람에게 읽어 줄 문장" }
      - { label: "수정한 날", name: "updated", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }
      - { label: "임시 보관 (켜면 사이트에 안 보임)", name: "draft", widget: "boolean", default: false, required: false }
      - { label: "본문", name: "body", widget: "markdown" }

  # ── 전국지점 ────────────────────────────────────────────
  - name: "branches"
    label: "전국지점"
    label_singular: "지점"
    description: "지점 하나가 페이지 하나가 됩니다. 지역을 고르면 지역별 목록과 사이트맵에 자동으로 들어갑니다."
    folder: "src/branches/posts"
    create: true
    identifier_field: "branchName"
    slug: "{{fields.slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "[{{region}}] {{branchName}}"
    sortable_fields: ["region", "branchName", "date"]
    view_groups:
      - { label: "지역별로 묶기", field: region }
    fields:
      - { label: "지점명", name: "branchName", widget: "string", hint: "예) 해운대점. 페이지 제목은 '와와학습코칭센터 해운대점'이 됩니다." }
      - label: "글 주소"
        name: "slug"
        widget: "string"
        hint: "영문 소문자와 하이픈. 예) haeundae → /branches/busan/haeundae/"
        pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "영문 소문자, 숫자, 하이픈만 쓸 수 있어요"]
      - label: "지역"
        name: "region"
        widget: "select"
        options:
          - { label: "서울", value: "seoul" }
          - { label: "경기", value: "gyeonggi" }
          - { label: "인천", value: "incheon" }
          - { label: "부산", value: "busan" }
          - { label: "대구", value: "daegu" }
          - { label: "광주", value: "gwangju" }
          - { label: "대전", value: "daejeon" }
          - { label: "울산", value: "ulsan" }
          - { label: "세종", value: "sejong" }
          - { label: "강원", value: "gangwon" }
          - { label: "충북", value: "chungbuk" }
          - { label: "충남", value: "chungnam" }
          - { label: "전북", value: "jeonbuk" }
          - { label: "전남", value: "jeonnam" }
          - { label: "경북", value: "gyeongbuk" }
          - { label: "경남", value: "gyeongnam" }
          - { label: "제주", value: "jeju" }
      - { label: "구·군", name: "district", widget: "string", hint: "예) 해운대구" }
      - { label: "주소", name: "address", widget: "string" }
      - { label: "찾아오는 길", name: "directions", widget: "string", required: false, hint: "예) 중동역 5번 출구에서 걸어서 3분" }
      - { label: "전화", name: "phone", widget: "string" }
      - { label: "운영 시간", name: "hours", widget: "string", required: false }
      - { label: "대상", name: "grades", widget: "string", default: "초등, 중등, 고등", required: false }
      - { label: "과목", name: "subjects", widget: "string", default: "국어, 영어, 수학", required: false }
      - { label: "한 줄 소개", name: "description", widget: "text", hint: "검색 결과에 보입니다. 담당 학교 이름을 넣으면 좋아요." }
      - { label: "대표 사진", name: "cover", widget: "image", required: false }
      - { label: "대표 사진 설명", name: "coverAlt", widget: "string", required: false }
      - { label: "카카오톡 채널 주소", name: "kakao", widget: "string", required: false }
      - { label: "네이버 지도 주소", name: "mapUrl", widget: "string", required: false }
      - { label: "학원명 (교육청 등록)", name: "academyName", widget: "string", required: false }
      - { label: "학원 등록번호", name: "regNo", widget: "string", required: false }
      - { label: "교습비 게시표 주소", name: "tuitionUrl", widget: "string", required: false }
      - label: "담당 학교"
        name: "schools"
        widget: "list"
        required: false
        summary: "{{fields.name}}"
        hint: "다음 시험 날짜를 넣으면 페이지에 D-day가 자동으로 나옵니다."
        fields:
          - { label: "학교 이름", name: "name", widget: "string" }
          - { label: "구분", name: "level", widget: "select", options: ["초", "중", "고"] }
          - { label: "다음 시험 첫날", name: "exam", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }
          - { label: "한 줄 메모", name: "note", widget: "string", required: false }
      - { label: "등록일", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "숨기기 (켜면 사이트에 안 보임)", name: "draft", widget: "boolean", default: false, required: false }
      - { label: "센터 소개", name: "body", widget: "markdown", required: false }

  # ── 사이트 설정 ─────────────────────────────────────────
  - name: "settings"
    label: "사이트 설정"
    editor: { preview: false }
    files:
      - label: "기본 정보"
        name: "site"
        file: "src/_data/site.json"
        fields:
          - { label: "브랜드 이름", name: "brand", widget: "string" }
          - { label: "사이트 제목", name: "title", widget: "string" }
          - { label: "한 줄 설명", name: "tagline", widget: "string" }
          - { label: "검색용 소개 문장", name: "description", widget: "text" }
          - { label: "사이트 주소 (끝에 / 없이)", name: "url", widget: "string" }
          - { label: "대표 전화", name: "phone", widget: "string" }
          - { label: "카카오톡 채널", name: "kakao", widget: "string", required: false }
          - { label: "네이버 소유확인 코드", name: "naverVerification", widget: "string", required: false, hint: "서치어드바이저 HTML 태그의 content 값만" }
          - { label: "구글 소유확인 코드", name: "googleVerification", widget: "string", required: false }
          - { label: "운영자", name: "operator", widget: "string", required: false }
          - { label: "운영사", name: "company", widget: "string" }
          - { label: "브랜드 시작 연도", name: "since", widget: "number" }
          - { label: "센터 수 표현", name: "centers", widget: "string", hint: "예) 200곳이 넘는" }
      - label: "자주 묻는 질문"
        name: "faq"
        file: "src/_data/faq.json"
        fields:
          - label: "질문 목록"
            name: "items"
            widget: "list"
            summary: "{{fields.q}}"
            fields:
              - { label: "질문", name: "q", widget: "string" }
              - { label: "답변", name: "a", widget: "text" }
